<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System-bus policy: who may own the sensord bus name, who may talk to it.
     Install to /usr/share/dbus-1/system.d/ -->
<busconfig>
  <policy user="root">
    <allow own="xyz.openbmc_project.VirtualSensor"/>
  </policy>
  <policy context="default">
    <allow send_destination="xyz.openbmc_project.VirtualSensor"/>
  </policy>
</busconfig>